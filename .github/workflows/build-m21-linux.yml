name: Build Galaxy M21 Mobile Linux (GNOME/Phosh)

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Target Mobile Linux Distribution'
        required: true
        default: 'droidian-phosh'
        type: choice
        options:
          - 'droidian-phosh'
          - 'postmarketos-phosh'

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Build Repository
        uses: actions/checkout@v4

      - name: Setup System Toolchains & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git \
            libssl-dev lld llvm make python3 python3-pip qemu-user-static \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip libncurses-dev \
            android-sdk-libsparse-utils zstd xz-utils libelf-dev cpio
          python3 -m pip install --upgrade pip setuptools || true

      - name: Clone Samsung Exynos 9611 Kernel (lineage-24.0)
        run: |
          echo "Cloning Parbindar7 Linux 4.14 kernel (lineage-24.0)..."
          git clone --depth 1 -b lineage-24.0 \
            https://github.com/Parbindar7/android_kernel_samsung_universal9611.git kernel

      - name: Download Clang Toolchain
        run: |
          echo "Cloning Proton-Clang prebuilt toolchain..."
          git clone --depth 1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Apply Halium & Linux Userspace defconfig Patch
        run: |
          echo "Applying M21 Linux hardware-enablement patch..."
          # Strip any KernelSU references to avoid path_umount linker errors
          sed -i 's/obj-$(CONFIG_KSU) += kernelsu/# obj-$(CONFIG_KSU) += kernelsu/' kernel/drivers/Makefile || true
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' kernel/drivers/Kconfig || true
          sed -i '/CONFIG_KSU/d' kernel/arch/arm64/configs/exynos9611-m21_defconfig || true

          cat << 'EOF' >> kernel/arch/arm64/configs/exynos9611-m21_defconfig
          # Mobile Linux & Halium Hardware-Enablement
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_MEMCG=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_SYSVIPC=y
          CONFIG_FHANDLE=y
          CONFIG_ANDROID=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"
          CONFIG_ASHMEM=y
          CONFIG_VT=y
          CONFIG_VT_CONSOLE=y
          CONFIG_FB=y
          CONFIG_FRAMEBUFFER_CONSOLE=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          CONFIG_OVERLAY_FS=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_KSU=n
          # CONFIG_KSU is not set
          EOF

      - name: Cross-Compile Linux Kernel & Device Tree Blob
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          echo "Generating defconfig..."
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos9611-m21_defconfig

          echo "Compiling Linux 4.14 kernel Image & DTBs..."
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image dtbs

      - name: Install & Configure mkbootimg
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg
          sudo cp mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg

      - name: Build Android Header v2 Boot Image (halium-boot.img)
        run: |
          mkdir -p ramdisk
          cat << 'EOF' > ramdisk/init
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          echo 172.16.42.1 > /dev/null
          exec /sbin/init
          EOF
          chmod +x ramdisk/init
          cd ramdisk && find . | cpio -o -H newc | gzip -9 > ../ramdisk.cpio.gz && cd ..

          # Locate base DTB for Exynos 9611
          DTB_PATH="kernel/out/arch/arm64/boot/dts/exynos/exynos9610.dtb"
          if [ ! -f "$DTB_PATH" ]; then
            DTB_PATH=$(find kernel/out/arch/arm64/boot/dts -name "*.dtb" | head -n 1)
          fi
          echo "Selected DTB for boot image: $DTB_PATH"

          # Assemble header v2 boot image matching M21 BoardConfig offsets
          mkbootimg \
            --kernel kernel/out/arch/arm64/boot/Image \
            --ramdisk ramdisk.cpio.gz \
            --dtb "$DTB_PATH" \
            --base 0x10000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0xf0000000 \
            --tags_offset 0x00000100 \
            --dtb_offset 0x00000000 \
            --pagesize 2048 \
            --header_version 2 \
            --cmdline "loop.max_part=7 androidboot.hardware=exynos9611 console=null" \
            -o halium-boot.img

      - name: Fetch and Assemble GNOME / Phosh Rootfs
        run: |
          mkdir -p rootfs_staging
          echo "Checking for official Droidian Phosh rootfs image..."
          # Note: Download is optional in CI to allow fast adaptation building
          curl -sSL -f -o droidian-rootfs.zip "https://github.com/droidian-images/droidian/releases/download/droidian/101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api29-arm64-101.20251130_20251207.zip" || touch rootfs.tar.xz

      - name: Package TWRP Sideloadable Installer ZIP
        run: |
          chmod +x scripts/generate-twrp-zip.sh
          ./scripts/generate-twrp-zip.sh

      - name: Prepare Final Release Directory
        run: |
          mkdir -p release_artifacts
          cp halium-boot.img release_artifacts/
          cp pmos-m21-gnome-twrp-installer.zip release_artifacts/
          ls -lh release_artifacts/

      - name: Upload Downloadable Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m21-mobile-linux-gnome-build
          path: release_artifacts/
          retention-days: 14
