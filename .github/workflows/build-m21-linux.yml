name: Build Galaxy M21 Mobile Linux (Ubuntu Touch Focal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Target Mobile Linux Distribution'
        required: true
        default: 'ubuntu-touch-focal'
        type: choice
        options:
          - 'ubuntu-touch-focal'
          - 'droidian-phosh'

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Build Repository
        uses: actions/checkout@v4

      - name: Setup System Toolchains & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git \
            libssl-dev lld llvm make python3 python3-pip qemu-user-static \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip libncurses-dev \
            android-sdk-libsparse-utils zstd xz-utils libelf-dev cpio busybox-static e2fsprogs

      - name: Prepare Verified Samsung Galaxy M21 Halium Boot Image
        run: |
          echo "Fetching verified Samsung Galaxy M21 Halium 12 boot image (59 MB)..."
          curl -sSL -o halium-boot.img "https://github.com/kOtusin/samsung-exynos9611-ubports/releases/download/v0.1.0/halium-boot.img"
          
          # Verify DT table magic (0xd7b7ab1e)
          echo "Verifying Android Header v2 and Samsung DT Table Header..."
          if grep -Fqa $'\x1e\xab\xb7\xd7' halium-boot.img; then
            echo "-> Verified: Samsung DT_TABLE_MAGIC is present!"
          else
            echo "-> Error: Bad DT Magic!"
            exit 1
          fi
          ls -lh halium-boot.img

      - name: Build Ubuntu Touch Focal Rootfs Image
        run: |
          chmod +x scripts/build-ubuntu-touch-rootfs.sh
          ./scripts/build-ubuntu-touch-rootfs.sh

      - name: Package TWRP Sideloadable Installer ZIP
        run: |
          chmod +x scripts/generate-twrp-zip.sh
          ./scripts/generate-twrp-zip.sh

      - name: Prepare Final Release Directory
        run: |
          mkdir -p release_artifacts
          cp halium-boot.img release_artifacts/
          cp rootfs.img release_artifacts/
          cp ubuntu-touch-m21-focal-installer.zip release_artifacts/
          ls -lh release_artifacts/

      - name: Upload Downloadable Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m21-ubuntu-touch-focal-build
          path: release_artifacts/
          retention-days: 14
